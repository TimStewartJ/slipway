name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, unit tests and server GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Fetch integration mods from Modrinth
        run: python3 tools/fetch-devmods.py
      # The client GameTests and the packaged-jar check need a real GPU and the Bliss shader pack; they run locally
      # (see README, "Testing").
      - name: Build and test
        run: ./gradlew assemble test runGametest checkPatches --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            build/reports/
            build/gametest/junit.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: slipway-jar
          path: build/libs/*.jar
