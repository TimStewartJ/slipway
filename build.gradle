import groovy.json.JsonSlurper
import java.security.MessageDigest

plugins {
	id 'net.fabricmc.fabric-loom' version '1.16.1'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-fabric-${project.minecraft_version}"
}

repositories {
	mavenCentral()
}

// Mods that Slipway integrates with but does not bundle; they are git-ignored. tools/fetch-devmods.py downloads the
// pinned Modrinth releases (tools/devmods.json); tools/setup-devmods.ps1 copies the author's play stack instead.
// -PslipwayDevmods=<dir> reads them from another directory. Distant Horizons is needed to compile the optional DH
// integration.
def devmods = providers.gradleProperty('slipwayDevmods').map { file(it) }.orNull ?: file('devmods')
def devmod = { String prefix ->
	def found = devmods.isDirectory() ? devmods.listFiles().findAll { it.name.startsWith(prefix) && it.name.endsWith('.jar') } : []
	found.isEmpty() ? null : found.sort { it.name }.last()
}
def dhJar = devmod('DistantHorizons-fabric-')
def sodiumJar = devmod('sodium-fabric-')
def irisJar = devmod('iris-fabric-')
if (dhJar == null) {
	throw new GradleException("${devmods}/DistantHorizons-fabric-*.jar is missing; run python tools/fetch-devmods.py first.")
}

sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
	// Fabric client GameTests: real client (and in-process dedicated server) runs driven tick by tick. See
	// src/clientGametest and DESIGN.md, "Testing". Its classpath is set after loom's split source sets exist.
	clientGametest {
	}
	// The packaged-jar check's tiny test mod (see runPackagedJarCheck).
	packagedCheck {
	}
	// The film tool: renders promotional footage with the client GameTest API (see src/film and FILM.md). Never part
	// of the release jar or of check.
	film {
	}
}

// Distant Horizons for the client GameTests: another build in devmods/test when there is one (tools/setup-devmods.ps1
// -TestDhJar, for trying a build before it goes into the play stack), else the play stack's jar.
// -PslipwayTestDhJar=<path> overrides both.
def testDhJar = providers.gradleProperty('slipwayTestDhJar').map { file(it) }.orNull ?: ({
	def testDir = new File(devmods, 'test')
	def found = testDir.isDirectory() ? testDir.listFiles().findAll { it.name.startsWith('DistantHorizons-fabric-') && it.name.endsWith('.jar') } : []
	found.isEmpty() ? dhJar : found.sort { it.name }.last()
})()
// The client GameTests run with the play stack's render mods unless -PslipwayClientGametestMods lists a subset
// (comma-separated: sodium, iris, dh; empty for none).
def clientGametestMods = ({
	def raw = providers.gradleProperty('slipwayClientGametestMods').orNull
	(raw == null ? 'sodium,iris,dh' : raw).split(',')*.trim().findAll { !it.isEmpty() }
})()

loom {
	splitEnvironmentSourceSets()

	mods {
		slipway {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		slipway_gametest {
			sourceSet sourceSets.gametest
		}
		slipway_client_gametest {
			sourceSet sourceSets.clientGametest
		}
		slipway_film {
			sourceSet sourceSets.film
		}
	}

	runs {
		// A headless dedicated server with Slipway only: proves native loading and physics in a real game.
		server {
			vmArg '-Dslipway.selftest=true'
			vmArg '-Dslipway.selftest.stop=' + (providers.gradleProperty('slipwaySelfTestStop').orNull ?: 'false')
			vmArg '--enable-native-access=ALL-UNNAMED'
		}
		client {
			vmArg '--enable-native-access=ALL-UNNAMED'
			// Mojang's 26.3 client version metadata adds this; without it the dev client can crash inside the JVM.
			vmArg '-XX:StackShadowPages=32'
		}
		// Fabric GameTests on a headless test server; the JUnit-style report lands in build/gametest.
		gametest {
			server()
			name = 'Slipway Game Tests'
			source sourceSets.gametest
			runDir 'build/gametest'
			vmArg '-Dfabric-api.gametest'
			vmArg '-Dfabric-api.gametest.report-file=' + file('build/gametest/junit.xml').absolutePath
			vmArg '--enable-native-access=ALL-UNNAMED'
		}
		// Fabric client GameTests: the full play stack (Sodium, Iris with Bliss available, Distant Horizons) plus
		// Slipway in a real client window that never takes focus (see ClientGametestPreLaunch). The JUnit-style report
		// and the screenshots land in build/client-gametest. Reference images live in src/clientGametest/resources/templates.
		// A missing reference image fails the test; -PslipwayRecordTemplates=true writes missing ones instead (review
		// them before committing).
		clientGametest {
			client()
			name = 'Slipway Client Game Tests'
			source sourceSets.clientGametest
			runDir 'build/client-gametest'
			programArgs '--username', 'SlipwayTester'
			vmArg '-Dfabric.client.gametest'
			// unattended: Fabric Loader must not open its error window (it waits for someone to close it)
			vmArg '-Dfabric.noGui=true'
			if (providers.gradleProperty('slipwayRecordTemplates').orNull == 'true') {
				vmArg '-Dfabric.client.gametest.testModResourcesPath=' + file('src/clientGametest/resources').absolutePath
			}
			vmArg '-Dslipway.clientGametest.reportDir=' + file('build/client-gametest').absolutePath
			vmArg '-Dslipway.clientGametest.only=' + (providers.gradleProperty('slipwayClientGametestOnly').orNull ?: '')
			vmArg '-Dslipway.clientGametest.soakMinutes=' + (providers.gradleProperty('slipwaySoakMinutes').orNull ?: '2')
			// inputs of the diagnostic scenarios (run only when named; see DiagScenarios)
			vmArg '-Dslipway.diag.world=' + (providers.gradleProperty('slipwayDiagWorld').orNull ?: '')
			vmArg '-Dslipway.diag.packOptions=' + (providers.gradleProperty('slipwayDiagPackOptions').orNull ?: '')
			vmArg '-Dslipway.diag.variants=' + (providers.gradleProperty('slipwayDiagVariants').orNull ?: '')
			vmArg '-Dslipway.diag.series=' + (providers.gradleProperty('slipwayDiagSeries').orNull ?: 'false')
			vmArg '-Dslipway.diag.freshLods=' + (providers.gradleProperty('slipwayDiagFreshLods').orNull ?: 'false')
			vmArg '--enable-native-access=ALL-UNNAMED'
			vmArg '-XX:StackShadowPages=32'
			// the multiplayer test removes vanilla's dedicated-server shutdown hook once its server stopped
			vmArg '--add-opens=java.base/java.lang=ALL-UNNAMED'
			// the play instance's collector and a test-instance-sized heap, so memory measurements match play
			vmArg '-XX:+UseZGC'
			vmArg '-Xmx8G'
		}
		// The film tool (src/film, FILM.md): the play stack in a real client window that never takes focus, driven by
		// the client GameTest API; it writes PNG frames and a frame log to build/film/out/<shot>. -PslipwayFilm=<shot>
		// picks the shot, -PslipwayFilmSize=<w>x<h> the frame size, -PslipwayFilmSubframes=<n> the frames per tick,
		// -PslipwayFilmOpts=k=v,k=v shot options.
		film {
			client()
			name = 'Slipway Film'
			source sourceSets.film
			runDir 'build/film'
			programArgs '--username', 'SlipwayFilm'
			vmArg '-Dfabric.client.gametest'
			vmArg '-Dfabric.noGui=true'
			vmArg '-Dslipway.film.shot=' + (providers.gradleProperty('slipwayFilm').orNull ?: 'spike')
			vmArg '-Dslipway.film.size=' + (providers.gradleProperty('slipwayFilmSize').orNull ?: '1080x1350')
			vmArg '-Dslipway.film.subframes=' + (providers.gradleProperty('slipwayFilmSubframes').orNull ?: '3')
			vmArg '-Dslipway.film.out=' + file('build/film/out').absolutePath
			// shot-specific options, key=value pairs separated by commas (FilmRig.opt)
			vmArg '-Dslipway.film.opts=' + (providers.gradleProperty('slipwayFilmOpts').orNull ?: '')
			vmArg '--enable-native-access=ALL-UNNAMED'
			vmArg '-XX:StackShadowPages=32'
			vmArg '-XX:+UseZGC'
			vmArg '-Xmx10G'
		}
	}
}


// The client GameTests see Slipway's common and client code (the client source set exists once loom split it).
sourceSets.clientGametest.compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
sourceSets.clientGametest.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output + sourceSets.client.runtimeClasspath + sourceSets.client.output
sourceSets.packagedCheck.compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
sourceSets.film.compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
sourceSets.film.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output + sourceSets.client.runtimeClasspath + sourceSets.client.output

configurations {
	// Platform-specific jolt-jni native libraries; their binaries are copied into the mod jar's resources.
	joltNatives {
		transitive = false
	}
	joltNativesDebug {
		transitive = false
	}
	packagedCheckRuntime {
		transitive = false
	}
}

def joltNativePlatforms = [
	'Windows64'    : 'windows-x86_64',
	'Windows_ARM64': 'windows-aarch64',
	'Linux64'      : 'linux-x86_64',
	'Linux_ARM64'  : 'linux-aarch64',
	'MacOSX64'     : 'macos-x86_64',
	'MacOSX_ARM64' : 'macos-aarch64',
]

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// The jolt-jni JVM library is platform-independent; it is published under several interchangeable names.
	implementation "com.github.stephengold:jolt-jni-Windows64:${project.jolt_jni_version}"
	include "com.github.stephengold:jolt-jni-Windows64:${project.jolt_jni_version}"
	joltNativePlatforms.keySet().each { platform ->
		joltNatives "com.github.stephengold:jolt-jni-${platform}:${project.jolt_jni_version}:${project.jolt_jni_flavor}"
	}
	['Windows64', 'Linux64', 'MacOSX_ARM64'].each { platform ->
		joltNativesDebug "com.github.stephengold:jolt-jni-${platform}:${project.jolt_jni_version}:DebugDp"
	}

	compileOnly files(dhJar)
	packagedCheckRuntime fabricApi.module('fabric-client-gametest-api-v1', project.fabric_version)
	if (providers.gradleProperty('slipwayRenderMods').orNull == 'true') {
		[sodiumJar, irisJar, dhJar].findAll { it != null }.each { localRuntime files(it) }
	}
	// The client GameTests reach Iris and Distant Horizons through their public APIs, and ask Sodium whether its
	// terrain is built.
	clientGametestCompileOnly files(dhJar)
	[irisJar, sodiumJar].findAll { it != null }.each { clientGametestCompileOnly files(it) }
	[sodium: sodiumJar, iris: irisJar, dh: testDhJar].each { name, jar ->
		if (clientGametestMods.contains(name) && jar != null) {
			clientGametestRuntimeOnly files(jar)
		}
	}
	filmCompileOnly files(dhJar)
	[irisJar, sodiumJar].findAll { it != null }.each { filmCompileOnly files(it) }
	[sodium: sodiumJar, iris: irisJar, dh: testDhJar].each { name, jar ->
		if (clientGametestMods.contains(name) && jar != null) {
			filmRuntimeOnly files(jar)
		}
	}

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

// Copies each platform's native library to <folder>/<os>-<arch>/ and writes a SHA-256 manifest the runtime
// loader verifies after extraction. The manifest is a properties file written here line by line: keys in order,
// \n line ends, no date. (Properties.store adds the time of the build and the build machine's line ends, which made
// two builds of one commit differ in this one jar entry.)
def registerNativeExtraction = { String taskName, Configuration natives, String folder, String flavor ->
	def outputDir = layout.buildDirectory.dir("generated/${taskName}")
	return tasks.register(taskName) {
		inputs.files(natives)
		outputs.dir(outputDir)
		doLast {
			def root = outputDir.get().asFile
			project.delete(root)
			def target = new File(root, folder)
			target.mkdirs()
			def manifest = new TreeMap<String, String>()
			natives.resolvedConfiguration.resolvedArtifacts.each { artifact ->
				def platform = joltNativePlatforms[artifact.moduleVersion.id.name.substring('jolt-jni-'.length())]
				if (platform == null) {
					throw new GradleException("Unknown jolt-jni platform artifact ${artifact.moduleVersion.id.name}")
				}
				def libraries = project.zipTree(artifact.file).matching { include '**/*.dll', '**/*.so', '**/*.dylib' }.files
				if (libraries.size() != 1) {
					throw new GradleException("Expected one native library in ${artifact.file.name}, found ${libraries*.name}")
				}
				def library = libraries.first()
				def dir = new File(target, platform)
				dir.mkdirs()
				def copy = new File(dir, library.name)
				copy.bytes = library.bytes
				def digest = MessageDigest.getInstance('SHA-256').digest(copy.bytes).encodeHex().toString()
				manifest[platform] = "${library.name} ${digest}".toString()
			}
			manifest['version'] = project.jolt_jni_version.toString()
			manifest['flavor'] = flavor
			manifest.each { key, value ->
				// nothing a properties file would need escaped: plain names, and values of printable ASCII without a backslash
				if (!(key ==~ /[A-Za-z0-9_.-]+/) || !(value ==~ /[!-\[\]-~][ -\[\]-~]*/)) {
					throw new GradleException("natives.properties: '${key}=${value}' would need escaping")
				}
			}
			new File(target, 'natives.properties').setText('#jolt-jni native libraries bundled by Slipway\n' + manifest.collect { key, value -> "${key}=${value}\n" }.join(''), 'UTF-8')
		}
	}
}

def extractJoltNatives = registerNativeExtraction('extractJoltNatives', configurations.joltNatives, 'slipway-natives', project.jolt_jni_flavor)
// Unit tests load the Debug build, whose allocation counters the native leak test reads.
def extractJoltNativesDebug = registerNativeExtraction('extractJoltNativesDebug', configurations.joltNativesDebug, 'slipway-natives-debug', 'DebugDp')
sourceSets.test.resources.srcDir(extractJoltNativesDebug)
sourceSets.main.resources.srcDir(extractJoltNatives)

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraftVersion', project.minecraft_version
	inputs.property 'loaderVersion', project.loader_version

	filesMatching('fabric.mod.json') {
		expand version: inputs.properties.version,
			minecraftVersion: inputs.properties.minecraftVersion,
			loaderVersion: inputs.properties.loaderVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 25
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

tasks.named('test').configure {
	useJUnitPlatform()
	systemProperty 'slipway.test.nativeCache', layout.buildDirectory.dir('tmp/test-natives').get().asFile.absolutePath
	systemProperty 'slipway.natives.root', '/slipway-natives-debug/'
	jvmArgs '--enable-native-access=ALL-UNNAMED'
	testLogging {
		events 'failed'
		exceptionFormat 'full'
	}
}

tasks.named('sourcesJar').configure {
	exclude 'slipway-natives/**'
}

jar {
	inputs.property 'archivesName', project.base.archivesName
	from('LICENSE') { rename { "${it}_${inputs.properties.archivesName}" } }
	from('NOTICE') { rename { "${it}_${inputs.properties.archivesName}" } }
}

// Two builds of one commit give the same jar. Gradle writes its entries with a fixed time; Loom then nests the
// jolt-jni jar through Java's zip file system, which stamps the two entries it adds (META-INF/jars/ and the jar in
// it) with the time of the build. Loom rewrites a remapped jar with fixed times afterwards, but not the jar of a game
// that is not remapped, so that rewrite is called here. It is not public Loom API: should a Loom update break this
// line, the block can go, and the jar is the same but for those times. (afterEvaluate: after the actions Loom adds.)
afterEvaluate {
	tasks.named('jar') {
		doLast {
			net.fabricmc.loom.util.ZipReprocessorUtil.reprocessZip(archiveFile.get().asFile.toPath(), true, false)
		}
	}
}

// ---------------------------------------------------------------------------------------------------------
// Patch registry: every mixin class and every method it targets must be listed in patches.json with a reason,
// the feature it serves and the test that covers it. PATCHES.md is generated from the registry.
// ---------------------------------------------------------------------------------------------------------

def patchRegistry = file('patches.json')
def patchesMarkdown = file('PATCHES.md')

def renderPatchesMarkdown = { Map registry ->
	def lines = []
	lines << '# Slipway patch registry'
	lines << ''
	lines << 'Generated from `patches.json` by `gradlew generatePatches`; `gradlew checkPatches` (part of `check`) fails when a'
	lines << 'mixin, a targeted method or a covering test is missing. Edit `patches.json`, not this file.'
	lines << ''
	def entries = registry.patches as List
	def hooks = entries.sum(0) { (it.methods as List).size() }
	lines << "**${entries.size()} mixin classes, ${hooks} hooked methods.**".toString()
	lines << ''
	lines << '| Mixin | Side | Target mod | Target class | Methods | Feature | Reason | Covered by |'
	lines << '| --- | --- | --- | --- | --- | --- | --- | --- |'
	entries.sort { it.mixin }.each { e ->
		lines << "| `${e.mixin}` | ${e.side} | ${e.targetMod} | `${e.targetClass}` | ${(e.methods as List).collect { "`${it}`" }.join('<br>')} | ${e.feature} | ${e.reason} | ${(e.tests as List).collect { "`${it}`" }.join('<br>')} |".toString()
	}
	lines << ''
	def extra = (registry.hooks ?: []) as List
	lines << '## Other hooks'
	lines << ''
	lines << 'Code that reaches into another mod without a mixin, marked in its source with `slipway-hook: <id>`.'
	lines << ''
	lines << "**${extra.size()} hooks.**".toString()
	lines << ''
	lines << '| Hook | Source | Target mod | Target | Access | Feature | Reason | Covered by |'
	lines << '| --- | --- | --- | --- | --- | --- | --- | --- |'
	extra.sort { it.id }.each { h ->
		lines << "| `${h.id}` | `${h.source}` | ${h.targetMod} | `${h.target}` | ${h.access} | ${h.feature} | ${h.reason} | ${(h.tests as List).collect { "`${it}`" }.join('<br>')} |".toString()
	}
	lines << ''
	return lines.join('\n')
}

def mixinSources = { ->
	def configs = [file('src/main/resources/slipway.mixins.json'), file('src/client/resources/slipway.client.mixins.json')]
	def found = [:]
	configs.findAll { it.isFile() }.each { cfg ->
		def json = new JsonSlurper().parse(cfg)
		def pkg = json.package
		def names = ((json.mixins ?: []) + (json.client ?: []) + (json.server ?: []))
		names.each { name ->
			def rel = (pkg + '.' + name).replace('.', '/') + '.java'
			def src = [file("src/main/java/${rel}"), file("src/client/java/${rel}")].find { it.isFile() }
			if (src == null) {
				throw new GradleException("Mixin ${pkg}.${name} listed in ${cfg.name} has no source file")
			}
			found["${pkg}.${name}".toString()] = src
		}
	}
	return found
}

def targetedMethods = { File src ->
	def text = src.getText('UTF-8')
	def methods = [] as LinkedHashSet
	(text =~ /method\s*=\s*\{?\s*"([^"]+)"/).each { methods << it[1].replaceAll(/\(.*$/, '') }
	(text =~ /@(?:Accessor|Invoker)\(\s*"([^"]+)"/).each { methods << it[1] }
	(text =~ /@Overwrite[\s\S]*?\s(\w+)\s*\(/).each { methods << it[1] }
	return methods
}

// A covering test id: Class#method (JUnit or server GameTest) or clientGametest:<scenario> (a Fabric client GameTest
// scenario in SlipwayClientGameTests).
def checkTestId = { String owner, String test, List problems ->
	if (test.startsWith('clientGametest:')) {
		def runner = file('src/clientGametest/java/dev/timstewart/slipway/clientgametest/SlipwayClientGameTests.java')
		def scenario = test.substring('clientGametest:'.length())
		if (!runner.isFile() || !(runner.getText('UTF-8').contains("new Scenario(\"${scenario}\"".toString()))) problems << "${owner}: client GameTest ${test} does not exist"
		return
	}
	def parts = test.split('#')
	def cls = parts[0]
	def method = parts.length > 1 ? parts[1] : null
	def rel = cls.replace('.', '/') + '.java'
	def src2 = [file("src/test/java/${rel}"), file("src/gametest/java/${rel}"), file("src/clientGametest/java/${rel}")].find { it.isFile() }
	if (src2 == null) {
		problems << "${owner}: test class ${cls} does not exist"
	} else if (method != null && !(src2.getText('UTF-8') =~ /void\s+${java.util.regex.Pattern.quote(method)}\s*\(/)) {
		problems << "${owner}: test method ${test} does not exist"
	}
}

tasks.register('generatePatches') {
	group = 'slipway'
	description = 'Regenerates PATCHES.md from patches.json.'
	inputs.file(patchRegistry)
	outputs.file(patchesMarkdown)
	doLast {
		patchesMarkdown.setText(renderPatchesMarkdown(new JsonSlurper().parse(patchRegistry)), 'UTF-8')
	}
}

tasks.register('checkPatches') {
	group = 'verification'
	description = 'Fails when a mixin or a hooked method is not registered in patches.json with a covering test.'
	inputs.file(patchRegistry)
	inputs.files(fileTree('src').matching { include '**/*.java', '**/*.mixins.json' })
	doLast {
		def registry = new JsonSlurper().parse(patchRegistry)
		def entries = (registry.patches as List).collectEntries { [(it.mixin): it] }
		def problems = []
		def mixins = mixinSources()
		mixins.each { name, src ->
			def entry = entries[name]
			if (entry == null) {
				problems << "mixin ${name} is not registered in patches.json"
				return
			}
			['side', 'targetMod', 'targetClass', 'feature', 'reason'].each { key ->
				if (!(entry[key] instanceof String) || entry[key].isBlank()) problems << "${name}: '${key}' is empty"
			}
			def registered = (entry.methods ?: []) as Set
			targetedMethods(src).each { method ->
				if (!registered.contains(method)) problems << "${name}: hooked method '${method}' is not listed in patches.json"
			}
			registered.each { method ->
				if (!targetedMethods(src).contains(method)) problems << "${name}: patches.json lists '${method}' but the mixin does not target it"
			}
			def tests = (entry.tests ?: []) as List
			if (tests.isEmpty()) problems << "${name}: no covering test"
			tests.each { test -> checkTestId(name, test, problems) }
		}
		entries.keySet().findAll { !mixins.containsKey(it) }.each { problems << "patches.json lists ${it}, which is not in any mixin config" }
		// Non-mixin hooks into other code (reflection): each is marked in its source with "slipway-hook: <id>".
		def hooks = ((registry.hooks ?: []) as List).collectEntries { [(it.id): it] }
		def marked = [:]
		fileTree('src').matching { include '**/*.java' }.each { f ->
			(f.getText('UTF-8') =~ /slipway-hook:\s*([\w.-]+)/).each { marked[it[1]] = f }
		}
		marked.each { id, f -> if (!hooks.containsKey(id)) problems << "hook ${id} (${f.name}) is not registered in patches.json" }
		hooks.each { id, hook ->
			['source', 'targetMod', 'target', 'access', 'feature', 'reason'].each { key ->
				if (!(hook[key] instanceof String) || hook[key].isBlank()) problems << "hook ${id}: '${key}' is empty"
			}
			if (!marked.containsKey(id)) problems << "hook ${id} is registered but no source is marked with 'slipway-hook: ${id}'"
			else if (file(hook.source).canonicalPath != marked[id].canonicalPath) problems << "hook ${id}: marked in ${marked[id]}, registered as ${hook.source}"
			def tests = (hook.tests ?: []) as List
			if (tests.isEmpty()) problems << "hook ${id}: no covering test"
			tests.each { test -> checkTestId("hook ${id}", test, problems) }
		}
		def expected = renderPatchesMarkdown(registry)
		if (!patchesMarkdown.isFile() || patchesMarkdown.getText('UTF-8').replace('\r\n', '\n') != expected) {
			problems << 'PATCHES.md is out of date; run gradlew generatePatches'
		}
		if (!problems.isEmpty()) {
			throw new GradleException("Patch registry check failed:\n  - " + problems.join('\n  - '))
		}
		logger.lifecycle("Patch registry OK: ${mixins.size()} mixin classes registered.")
	}
}

tasks.named('check').configure { dependsOn 'checkPatches' }

tasks.named('check').configure { dependsOn 'runGametest' }
// The tests and the film fly vessels built to test or show something else than their rig: in their run directories
// newly assembled vessels are free of the survival rules (the settings' "survivalRules" is off; every other value is
// the default). The tests of the rules put their own vessels under them.
ext.freeVesselsConfig = { File runDir ->
	def config = new File(runDir, 'config')
	config.mkdirs()
	new File(config, 'slipway.json').setText('{"survivalRules": false}\n', 'UTF-8')
}
// Every run of the server GameTests starts in a new world, as on CI. The world of an earlier run holds that run's
// vessels and whatever the code it ran left in their plots, and its freed plots would be handed to this run's vessels.
tasks.matching { it.name == 'runGametest' }.configureEach {
	doFirst {
		project.delete(file('build/gametest/world'))
		freeVesselsConfig(file('build/gametest'))
	}
}

// The client GameTests use the Bliss shader pack, as the play instance does. It is copied from the author's Tellus 26.3
// instance (-PslipwayShaderPack=<zip> overrides); a missing pack makes the shader tests fail, not skip.
def shaderPackSource = providers.gradleProperty('slipwayShaderPack').map { file(it) }.orNull ?:
	file("${System.getenv('APPDATA')}/PrismLauncher/instances/Tellus-Expeditions-MC-26.3-Fabric/.minecraft/shaderpacks/Bliss_v2.1.2_(Chocapic13_Shaders_edit).zip")
def testDhConfigSource = providers.gradleProperty('slipwayTestDhConfig').map { file(it) }.orNull
tasks.register('prepareClientGametestRun') {
	group = 'slipway'
	description = 'Puts the shader pack and a shaders-off Iris config into the client GameTest run directory.'
	def runDir = file('build/client-gametest')
	outputs.upToDateWhen { false }
	doLast {
		def packs = new File(runDir, 'shaderpacks')
		packs.mkdirs()
		if (shaderPackSource.isFile()) {
			def target = new File(packs, shaderPackSource.name)
			if (!target.isFile() || target.length() != shaderPackSource.length()) {
				target.bytes = shaderPackSource.bytes
			}
		} else {
			logger.warn("Shader pack not found at ${shaderPackSource}; the shader tests will fail")
		}
		def config = new File(runDir, 'config')
		config.mkdirs()
		freeVesselsConfig(runDir)
		// Every run starts from the game's and Distant Horizons' defaults plus the tests' own options: Fabric's client
		// GameTest takes its "default" options after options.txt is loaded, so a value saved by an earlier run (such as
		// a diagnostic's field of view) would otherwise carry into every later run and change what the shots show.
		new File(runDir, 'options.txt').delete()
		def dhConfig = new File(config, 'DistantHorizons.toml')
		dhConfig.delete()
		// -PslipwayTestDhConfig=<file>: start Distant Horizons from that config instead (diagnostic runs)
		if (testDhConfigSource != null) {
			dhConfig.bytes = testDhConfigSource.bytes
		}
		// shaders start off; the tests turn them on through Iris's API where they need them
		new File(config, 'iris.properties').setText([
			'allowUnknownShaders=false', 'colorSpace=SRGB', 'disableUpdateMessage=true', 'enableDebugOptions=false',
			'enableShaders=false', 'maxShadowRenderDistance=32', "shaderPack=${shaderPackSource.name}".toString()
		].join('\n') + '\n', 'UTF-8')
		// the multiplayer test starts a dedicated server in this directory (as the e2e harness does for its server)
		new File(runDir, 'eula.txt').setText('eula=true\n', 'US-ASCII')
		// Bliss's volumetric clouds drift with real time and cast shadows; frozen and without their shadows, the shaded
		// views repeat exactly (the vessel's own shadow comes from the shadow map and stays).
		new File(packs, "${shaderPackSource.name}.txt").setText('Cloud_Speed=0.0\nCLOUDS_SHADOWS=false\nVL_CLOUDS_SHADOWS=false\n', 'UTF-8')
	}
}
tasks.matching { it.name == 'runClientGametest' }.configureEach {
	dependsOn 'prepareClientGametestRun'
	// the report file is written by the tests; a failing test also makes the game (and this task) exit non-zero
	outputs.upToDateWhen { false }
}
// The film run (FILM.md): shaders on from the start with the film's own Bliss settings (src/film/bliss.txt). The
// shader pack is not in the repository and has no default place outside it: -PslipwayShaderPack=<zip>, or the newest
// zip in <devmods>/shaderpacks (git-ignored, like the mods).
def filmShaderPack = providers.gradleProperty('slipwayShaderPack').map { file(it) }.orNull ?: ({
	def dir = new File(devmods, 'shaderpacks')
	def found = dir.isDirectory() ? dir.listFiles().findAll { it.name.endsWith('.zip') } : []
	found.isEmpty() ? null : found.sort { it.name }.last()
})()
// The film's code is compiled against Sodium and Iris (the mod itself needs neither): say so instead of failing
// with missing classes.
def requireFilmMods = {
	def missing = [Sodium: sodiumJar, Iris: irisJar].findAll { it.value == null }.keySet()
	if (!missing.isEmpty()) {
		throw new GradleException("The film needs ${missing.join(' and ')} in ${devmods}: run python tools/fetch-devmods.py (FILM.md, \"What is needed\").")
	}
}
tasks.named('compileFilmJava').configure {
	doFirst { requireFilmMods() }
}
tasks.register('prepareFilmRun') {
	group = 'slipway'
	description = 'Puts the shader pack, an Iris config with shaders on and the film Bliss settings into build/film.'
	def runDir = file('build/film')
	def blissSettings = file('src/film/bliss.txt')
	inputs.file(blissSettings)
	outputs.upToDateWhen { false }
	doLast {
		requireFilmMods()
		if (filmShaderPack == null || !filmShaderPack.isFile()) {
			throw new GradleException("The film needs a shader pack (it was made with Bliss v2.1.2; FILM.md, \"What is needed\"): put the zip into "
				+ "${new File(devmods, 'shaderpacks')} or pass -PslipwayShaderPack=<zip>." + (filmShaderPack == null ? '' : " Not found: ${filmShaderPack}"))
		}
		def packs = new File(runDir, 'shaderpacks')
		packs.mkdirs()
		def target = new File(packs, filmShaderPack.name)
		if (!target.isFile() || target.length() != filmShaderPack.length()) {
			target.bytes = filmShaderPack.bytes
		}
		def config = new File(runDir, 'config')
		config.mkdirs()
		freeVesselsConfig(runDir)
		new File(config, 'iris.properties').setText([
			'allowUnknownShaders=false', 'colorSpace=SRGB', 'disableUpdateMessage=true', 'enableDebugOptions=false',
			'enableShaders=true', 'maxShadowRenderDistance=32', "shaderPack=${filmShaderPack.name}".toString()
		].join('\n') + '\n', 'UTF-8')
		new File(packs, "${filmShaderPack.name}.txt").setText(blissSettings.getText('UTF-8'), 'UTF-8')
		logger.lifecycle("Film run: shader pack ${filmShaderPack.name}, Distant Horizons ${clientGametestMods.contains('dh') ? testDhJar.name : 'off'}, "
			+ "${sodiumJar.name}, ${irisJar.name}")
	}
}
tasks.matching { it.name == 'runFilm' }.configureEach {
	dependsOn 'prepareFilmRun'
	outputs.upToDateWhen { false }
}
tasks.named('check').configure { dependsOn 'runClientGametest' }

// Packaged-jar check: the release jar with the exact play-stack jars (devmods, copied from the play instance) in
// production Minecraft, with a tiny client-GameTest mod that audits every mixin, checks the mod set, opens a world,
// assembles a ship and fails on any Mixin or Fabric Loader error. Report: build/packaged-check/report.json.
// -PslipwayPackagedCheckMods picks the integration mods (comma-separated: sodium, iris, dh; empty for Fabric API
// only) and -PslipwayPackagedCheckDhJar=<jar> swaps in another Distant Horizons build, for compatibility checks.
def fabricApiJar = devmod('fabric-api-')
def gradleList = { String name, String fallback ->
	def raw = providers.gradleProperty(name).orNull
	(raw == null ? fallback : raw).split(',')*.trim().findAll { !it.isEmpty() }
}
def packagedCheckMods = gradleList('slipwayPackagedCheckMods', 'sodium,iris,dh')
def packagedCheckJars = [sodium: sodiumJar, iris: irisJar, dh: providers.gradleProperty('slipwayPackagedCheckDhJar').map { file(it) }.orNull ?: dhJar]
def packagedCheckModIds = [sodium: 'sodium', iris: 'iris', dh: 'distanthorizons']
def packagedCheckJar = tasks.register('packagedCheckJar', Jar) {
	group = 'slipway'
	description = 'Builds the test mod the packaged-jar check runs with.'
	archiveFileName = 'slipway-packaged-check.jar'
	destinationDirectory = layout.buildDirectory.dir('packaged-check-mod')
	from sourceSets.packagedCheck.output
}
tasks.register('runPackagedJarCheck', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	group = 'verification'
	description = 'Starts the release jar with the exact play-stack jars in production Minecraft; fails on any mixin or loader error.'
	def report = file('build/packaged-check/report.json')
	doFirst {
		def missing = (['fabric-api'] + packagedCheckMods).findAll { (it == 'fabric-api' ? fabricApiJar : packagedCheckJars[it]) == null }
		if (!missing.isEmpty()) {
			throw new GradleException("devmods is missing ${missing}; run python tools/fetch-devmods.py")
		}
		report.delete()
	}
	mods.from(tasks.named('jar'))
	mods.from(files(([fabricApiJar] + packagedCheckMods.collect { packagedCheckJars[it] }).findAll { it != null }))
	// Fabric API's release jar leaves out the client GameTest module the check runs on (Distant Horizons happens to
	// bundle a copy), so the check brings its own.
	mods.from(configurations.packagedCheckRuntime)
	mods.from(packagedCheckJar)
	runDir = layout.buildDirectory.dir('packaged-check')
	jvmArgs.addAll('-Dfabric.client.gametest', '-Dfabric.noGui=true', '--enable-native-access=ALL-UNNAMED', '-XX:StackShadowPages=32', '-XX:+UseZGC', '-Xmx4G',
		'-Dslipway.packagedCheck.report=' + report.absolutePath,
		'-Dslipway.packagedCheck.expectedMods=' + (['slipway', 'fabric-api'] + packagedCheckMods.collect { packagedCheckModIds[it] }).join(','),
		'-Dslipway.packagedCheck.absentMods=' + packagedCheckModIds.findAll { !packagedCheckMods.contains(it.key) }.values().join(','))
	outputs.upToDateWhen { false }
	doLast {
		def result = new JsonSlurper().parse(report)
		if (result.result != 'pass') {
			throw new GradleException("Packaged-jar check failed: ${result.failure}")
		}
		logger.lifecycle("Packaged-jar check passed: ${result.mods}; mixin audit ${result.mixinAuditSeconds} s; ${result.mixinOrLoaderWarnings.size()} warnings")
	}
}
tasks.named('check').configure { dependsOn 'runPackagedJarCheck' }
